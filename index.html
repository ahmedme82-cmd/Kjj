const sec2hm = s => `${p2(Math.floor(s/3600)%24)}:${p2(Math.floor(s%3600/60))}`;
const hm12 = hm => { const h = +hm.split(':')[0]; return (h%12===0?12:h%12) + ':' + hm.split(':')[1]; };
const period = hm => (+hm.split(':')[0] < 12) ? 'ص' : 'م';

function cairoNow(){
  const fmt = new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Cairo',hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const o = {}; fmt.formatToParts(new Date()).forEach(p => o[p.type] = p.value);
  return { key:`${o.year}-${o.month}-${o.day}`, sec:(+o.hour)*3600 + (+o.minute)*60 + (+o.second), h:+o.hour, mi:+o.minute, s:+o.second };
}

    card.id = 'card-' + e.k;
    card.style.animationDelay = (idx*80) + 'ms';
    card.querySelector('.icon').innerHTML = ICONS[e.k];
    card.querySelector('h3').textContent = e.n;
    card.querySelector('.en').textContent = e.en;
    card.querySelector('.time bdi').textContent = hm12(rec[e.k]);
    card.querySelector('.time small').textContent = period(rec[e.k]);
    DOM.cards.appendChild(card);
  });
}
function renderPills(sel){
  DOM.months.innerHTML = '';
  MKEYS.forEach(k => {
    const b = tpl('tpl-pill');
    b.dataset.m = k;
    b.textContent = MONTHS[k].name;
    b.setAttribute('aria-label', 'عرض جدول ' + MONTHS[k].label);
    b.setAttribute('aria-selected', k === sel ? 'true' : 'false');
    if(k === sel) b.classList.add('on');
    DOM.months.appendChild(b);
  });
}
function renderTable(monthKey){
  const meta = MONTHS[monthKey];
  DOM.tableSub.textContent = meta.label + 'م — الموافق ' + meta.hijri;
  const frag = document.createDocumentFragment();
  meta.rows.forEach(r => {
    const dt = dateOf(r.g);
    const tr = tpl('tpl-row');
    if(dt.getDay() === 5) tr.classList.add('friday');
    if(r.g === state.todayRec.g) tr.classList.add('today');
    tr.id = 'row-' + r.g;
    const wd = tr.querySelector('.wd');
    wd.textContent = WD_FMT.format(dt);
    if(r.g === state.todayRec.g){
      const pill = document.createElement('span');
      pill.className = 'pill'; pill.textContent = 'اليوم';
      wd.appendChild(pill);
    }
    tr.querySelector('.g bdi').textContent = r.g;
    tr.querySelector('.hj').textContent = r.h + ' 1448';
    const tds = tr.querySelectorAll('td.t');
    [r.f, r.s, r.d, r.a, r.m, r.i].forEach((hm, i) => {
      tds[i].querySelector('bdi').textContent = hm12(hm);
      tds[i].querySelector('small').textContent = period(hm);
    });
    frag.appendChild(tr);
  });
  DOM.tbody.innerHTML = '';
  DOM.tbody.appendChild(frag);
}
/* أوقات الكراهة — نطاقات bidi سليمة: جزيرتا LTR مستقلتان */
function computeWindows(rec){
  return [
    {id:'k-sun', name:'كراهة الشروق',   a:toSec(rec.s),              b:toSec(rec.s)+K_SUNRISE*60},
    {id:'k-zen', name:'كراهة الاستواء', a:toSec(rec.d)-K_ZENITH*60,  b:toSec(rec.d)},
    {id:'k-isf', name:'كراهة الاصفرار', a:toSec(rec.m)-K_ISFIRAR*60, b:toSec(rec.m)}
  ];
}
function renderKarah(wins){
  DOM.kChips.innerHTML = '';
  wins.forEach(w => {
    const chip = tpl('tpl-kchip');
    chip.id = w.id;
    chip.querySelector('b').textContent = w.name;
    chip.querySelector('span').innerHTML =
      `<bdi dir="ltr">${hm12(sec2hm(w.a))}</bdi> – <bdi dir="ltr">${hm12(sec2hm(w.b))}</bdi> <small>${period(sec2hm(w.b))}</small>`;
    DOM.kChips.appendChild(chip);
  });
}
function updateKarah(wins, sec){
  wins.forEach(w => {
    const el = document.getElementById(w.id); if(!el) return;
    const em = el.querySelector('em');
    if(sec >= w.a && sec < w.b){
      el.classList.add('active');
      const left = w.b - sec;
      em.hidden = false;
      em.textContent = 'الآن — ينتهي خلال ' + p2(Math.floor(left/60)) + ':' + p2(left%60);
    } else { el.classList.remove('active'); em.hidden = true; }
  });
}

/* ================= clock engine ================= */
const RING_R = 60, RING_C = 2 * Math.PI * RING_R;
DOM.ringProg.style.strokeDasharray = RING_C;
DOM.ringProg.style.strokeDashoffset = RING_C;
let _lastNextKey = '';
function resetNextFlag(){ _lastNextKey = ''; }
function startClock(state, onRollover){
  const tick = () => {
    const now = cairoNow();
    const h12 = now.h%12===0 ? 12 : now.h%12;
    DOM.chipClock.textContent = `${h12}:${p2(now.mi)}:${p2(now.s)}`;
    DOM.chipClockPeriod.textContent = now.h < 12 ? 'ص' : 'م';

    if(now.key !== state.curKey){
      state.curKey = now.key;
      const rec0 = ALL.find(r => r.g === now.key);
      if(rec0 && rec0 !== state.todayRec) onRollover(rec0, now);
    }
    updateKarah(state.wins, now.sec);

    const rec = ALL.find(r => r.g === now.key) || state.todayRec;
    const idx = ALL.indexOf(rec);
    const evs = EVENTS.map(e => ({...e, sec: toSec(rec[e.k])}));

    let next = evs.find(e => e.sec > now.sec), nextIsTomorrow = false;
    if(!next){ const tmr = ALL[idx+1] || rec; next = {k:'f', n:'فجر الغد', sec: toSec(tmr.f) + 86400}; nextIsTomorrow = true; }
    let prev = [...evs].reverse().find(e => e.sec <= now.sec);
    if(!prev){ const yst = ALL[idx-1] || rec; prev = {k:'i', n:'عشاء', sec: toSec(yst.i) - 86400}; }

    const remaining = next.sec - now.sec;
    const span = Math.max(1, next.sec - prev.sec);
    DOM.ringProg.style.strokeDashoffset = RING_C * (remaining / span);
    DOM.cdText.innerHTML = `<b>${p2(Math.floor(remaining/3600))}:${p2(Math.floor(remaining%3600/60))}:${p2(remaining%60)}</b>`;

    const key = next.k + '|' + next.sec;
    if(key !== _lastNextKey){
      _lastNextKey = key;
      DOM.nextName.textContent = next.n;
      DOM.nextTime.textContent = hm12(nextIsTomorrow ? rec.f : rec[next.k]);
      DOM.nextPeriod.textContent = period(nextIsTomorrow ? rec.f : rec[next.k]);
      DOM.cards.querySelectorAll('.card').forEach(c => { c.classList.remove('next'); c.querySelector('.flag').hidden = true; });
      if(!nextIsTomorrow){
        const card = document.getElementById('card-' + next.k);
        if(card){ card.classList.add('next'); card.querySelector('.flag').hidden = false; }
      }
    }
  };
  tick(); setInterval(tick, 1000);
}

/* ================= PWA: أيقونات + manifest (لتثبيت الويب) ================= */
(function(){
  function roundRectPath(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
  function star8(ctx,cx,cy,r){ctx.save();ctx.translate(cx,cy);[0,Math.PI/4].forEach(a=>{ctx.save();ctx.rotate(a);ctx.strokeRect(-r*0.7,-r*0.7,r*1.4,r*1.4);ctx.restore();});ctx.restore();}
  function star4(ctx,cx,cy,r){ctx.beginPath();ctx.moveTo(cx,cy-r);ctx.lineTo(cx+r*0.35,cy-r*0.35);ctx.lineTo(cx+r,cy);ctx.lineTo(cx+r*0.35,cy+r*0.35);ctx.lineTo(cx,cy+r);ctx.lineTo(cx-r*0.35,cy+r*0.35);ctx.lineTo(cx-r,cy);ctx.lineTo(cx-r*0.35,cy-r*0.35);ctx.closePath();ctx.fill();}
  function makeIcon(px, maskable){
    const c = document.createElement('canvas'); c.width = c.height = px;
    const x = c.getContext('2d'), s = px;
    const g = x.createLinearGradient(0,0,s,s); g.addColorStop(0,'#177a6c'); g.addColorStop(1,'#072b26');
    if(maskable){ x.fillStyle = g; x.fillRect(0,0,s,s); } else { roundRectPath(x,0,0,s,s,s*0.18); x.fillStyle = g; x.fill(); }
    x.save(); x.globalAlpha = .10; x.strokeStyle = '#fff'; x.lineWidth = s*0.012;
    star8(x, s*0.16, s*0.20, s*0.10); star8(x, s*0.86, s*0.78, s*0.11); star8(x, s*0.80, s*0.14, s*0.06);
    x.restore();
    const cx = s*0.46, cy = s*0.50, R = s*(maskable?0.23:0.26);
    x.fillStyle = '#d3a545'; x.beginPath(); x.arc(cx,cy,R,0,7); x.fill();
    x.fillStyle = g; x.beginPath(); x.arc(cx+R*0.42, cy-R*0.18, R*0.82, 0, 7); x.fill();
    x.fillStyle = '#e6b354'; star4(x, cx+R*0.95, cy-R*0.42, s*0.07);
    x.strokeStyle = 'rgba(211,165,69,.9)'; x.lineWidth = s*0.03; x.lineCap = 'round';
    x.beginPath(); x.arc(s*0.5, s*1.08, s*0.62, Math.PI*1.22, Math.PI*1.78); x.stroke();
    return c.toDataURL('image/png');
  }
  const manifest = {
    name:'مواقيت الصلاة — السويس', short_name:'مواقيت الصلاة',
    description:'مواقيت الصلاة وأوقات الكراهة لمدينة السويس — أغسطس إلى ديسمبر 2026',
    lang:'ar', dir:'rtl',
    start_url: location.href, scope: new URL('.', location.href).href, id: location.pathname,
    display:'standalone', orientation:'portrait',
    theme_color:'#0b3d36', background_color:'#f7f4ec',
    icons:[
      {src:makeIcon(192,false), sizes:'192x192', type:'image/png', purpose:'any'},
      {src:makeIcon(512,false), sizes:'512x512', type:'image/png', purpose:'any'},
      {src:makeIcon(512,true),  sizes:'512x512', type:'image/png', purpose:'maskable'}
    ]
  };
  const mLink = document.createElement('link'); mLink.rel = 'manifest';
  mLink.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'}));
  document.head.appendChild(mLink);
})();

/* ================= app bootstrap ================= */
const state = {
  curKey: cairoNow().key,
  todayRec: null,
  selMonth: null,
  wins: []
};
state.todayRec = ALL.find(r => r.g === state.curKey) || ALL[5];
state.selMonth = MKEYS.includes(state.curKey.slice(0,7)) ? state.curKey.slice(0,7) : '2026-08';

function renderDay(){
  renderChips(state.todayRec);
  renderCards(state.todayRec);
  state.wins = computeWindows(state.todayRec);
  renderKarah(state.wins);
  renderTable(state.selMonth);
  resetNextFlag();
}
function onRollover(rec0, now){
  state.todayRec = rec0;
  const mk = now.key.slice(0,7);
  if(MKEYS.includes(mk) && mk !== state.selMonth){ state.selMonth = mk; renderPills(state.selMonth); }
  renderDay();
}
DOM.months.addEventListener('click', e => {
  const b = e.target.closest('.m-pill'); if(!b || b.dataset.m === state.selMonth) return;
  state.selMonth = b.dataset.m;
  renderPills(state.selMonth);
  fadeSwap(DOM.tableEl, () => renderTable(state.selMonth));
});
DOM.jumpToday.addEventListener('click', () => {
  const mk = state.todayRec.g.slice(0,7);
  if(mk !== state.selMonth){ state.selMonth = mk; renderPills(mk); renderTable(mk); }
  const row = document.getElementById('row-' + state.todayRec.g);
  if(row) row.scrollIntoView({behavior:'smooth', block:'center'});
});

renderDay();
renderPills(state.selMonth);
startClock(state, onRollover);
</script>
