<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b3d36">
<title>مواقيت الصلاة — السويس</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b3d36'/%3E%3Cpath d='M45 35a14 14 0 1 1-15-17 11 11 0 0 0 15 17z' fill='%23d3a545'/%3E%3Cpath d='M43 18l1.6 3.4 3.4 1.6-3.4 1.6L43 28l-1.6-3.4-3.4-1.6 3.4-1.6z' fill='%23e6b354'/%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
<style>
  /* Inline fallback styles in case styles.css hasn't updated yet */
  :root { --teal-900:#0b3d36; --teal-700:#11655a; --gold:#d3a545; --cream:#f7f4ec; --radius-sm:12px; --radius-md:14px; --radius-pill:999px; --sp-1:8px; --sp-2:12px; --sp-3:16px; }
  body { font-family: 'Cairo', sans-serif; background: var(--cream); margin: 0; direction: rtl; }
  .topbar { position: sticky; top: 0; z-index: 50; background: rgba(247,244,236,.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(17,101,90,.1); }
  .topbar-in { max-width: 1120px; margin: auto; padding: var(--sp-2) 20px; display: flex; align-items: center; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .logo { width: 42px; height: 42px; border-radius: var(--radius-sm); background: linear-gradient(135deg, var(--teal-700), var(--teal-900)); display: grid; place-items: center; color: var(--gold); }
  .brand h2 { font-size: 1.1rem; font-weight: 900; color: var(--teal-900); margin: 0; }
  
  .hero { background: linear-gradient(135deg, #072b26, #11655a); color: #fff; padding: 40px 20px; text-align: center; }
  .next-card { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); border-radius: 24px; padding: 24px; max-width: 500px; margin: 0 auto; }
  
  .karah { margin-top: 20px; border-top: 1px dashed rgba(255,255,255,.2); padding-top: 16px; }
  .k-head { font-weight: 800; font-size: 0.9rem; margin-bottom: 12px; display: flex; justify-content: center; gap: 8px; align-items: center; }
  .k-head small { color: var(--gold); font-size: 0.75rem; }
  .k-chips { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .k-chip { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); border-radius: var(--radius-sm); padding: 10px 14px; min-width: 140px; }
  .k-chip b { display: block; color: var(--gold); font-size: 0.8rem; margin-bottom: 4px; }
  .k-chip span { font-size: 0.9rem; font-weight: 700; direction: rtl; }
  .k-chip span bdi { unicode-bidi: isolate; }
  
  .chips { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
  .chip { background: rgba(255,255,255,.1); border-radius: var(--radius-md); padding: 8px 16px; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20.4 14.2A8.8 8.8 0 0 1 9.8 3.6a.7.7 0 0 0-.9-.85 9.6 9.6 0 1 0 12.35 12.35.7.7 0 0 0-.85-.9Z"/><path d="M17.2 4.6l.9 2 2 .9-2 .9-.9 2-.9-2-2-.9 2-.9Z"/></svg>
      </div>
      <h2>مواقيت الصلاة - السويس</h2>
    </div>
  </div>
</header>

<section class="hero">
  <div class="next-card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
      <div>
        <div style="font-size:0.8rem; opacity:0.8;">الصلاة التالية</div>
        <div style="font-size:2rem; font-weight:900; color:var(--gold);" id="nextName">فجر</div>
        <div style="font-size:1.2rem; font-weight:800;"><bdi dir="ltr" id="nextTime">4:36</bdi> <small id="nextPeriod">ص</small></div>
      </div>
      <div style="text-align:center;">
        <div style="font-size:1.8rem; font-weight:900; font-variant-numeric:tabular-nums;" id="cdText">00:09:25</div>
        <div style="font-size:0.7rem; opacity:0.7;">متبقي حتى الصلاة</div>
      </div>
    </div>

    <div class="karah">
      <div class="k-head">أوقات الكراهة <small>حنفي</small></div>
      <div class="k-chips" id="kChips">
        <!-- Chips injected by JS, but here is the static fallback structure -->
        <div class="k-chip">
          <b>كراهة الشروق</b>
          <span><bdi dir="ltr">6:12</bdi> – <bdi dir="ltr">6:32</bdi> <small>ص</small></span>
        </div>
        <div class="k-chip">
          <b>كراهة الاستواء</b>
          <span><bdi dir="ltr">12:46</bdi> – <bdi dir="ltr">12:56</bdi> <small>م</small></span>
        </div>
        <div class="k-chip">
          <b>كراهة الاصفرار</b>
          <span><bdi dir="ltr">7:09</bdi> – <bdi dir="ltr">7:39</bdi> <small>م</small></span>
        </div>
      </div>
    </div>
  </div>

  <div class="chips">
    <div class="chip"><span id="chipGreg">الجمعة، 7 أغسطس 2026</span></div>
    <div class="chip"><span id="chipHijri">24 صفر 1448هـ</span></div>
    <div class="chip"><bdi dir="ltr" id="chipClock">4:26:00</bdi> <span id="chipClockPeriod">ص</span></div>
  </div>
</section>

<script>
  // Minimal JS to demonstrate the bidi fix dynamically if you wire it up
  function renderKarahFixed(wins) {
    const container = document.getElementById('kChips');
    container.innerHTML = '';
    wins.forEach(w => {
      const chip = document.createElement('div');
      chip.className = 'k-chip';
      chip.innerHTML = `
        <b>${w.name}</b>
        <span><bdi dir="ltr">${w.start}</bdi> – <bdi dir="ltr">${w.end}</bdi> <small>${w.period}</small></span>
      `;
      container.appendChild(chip);
    });
  }

  // Example data matching your screenshot
  const karahData = [
    { name: 'كراهة الشروق', start: '6:12', end: '6:32', period: 'ص' },
    { name: 'كراهة الاستواء', start: '12:46', end: '12:56', period: 'م' },
    { name: 'كراهة الاصفرار', start: '7:09', end: '7:39', period: 'م' }
  ];
  
  // Uncomment to test dynamic rendering:
  // renderKarahFixed(karahData);
</script>

</body>
</html>
